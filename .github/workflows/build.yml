name: Build

on:
  push:
    branches: [ net48 ]
  pull_request:
    branches: [ net48 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for GitVersion

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1
      with:
        useConfigFile: true

    - name: Display Version
      run: |
        echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
        echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"

    - name: Restore dependencies
      run: dotnet restore src/FlaUI.Mcp/FlaUI.Mcp.csproj

    - name: Build
      run: |
        dotnet build src/FlaUI.Mcp/FlaUI.Mcp.csproj `
          --configuration Release `
          --no-restore `
          -p:Version=${{ steps.gitversion.outputs.semVer }}

    - name: Publish (net48, AnyCPU)
      run: |
        dotnet publish src/FlaUI.Mcp/FlaUI.Mcp.csproj `
          --configuration Release `
          --output ./publish/net48 `
          -p:Version=${{ steps.gitversion.outputs.semVer }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlaUI-MCP-net48
        path: ./publish/net48/
