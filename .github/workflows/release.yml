name: Release

on:
  push:
    tags:
      - 'v*-net48'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create, for example v0.1.1-net48'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: true
        default: true
        type: boolean
      prerelease:
        description: 'Mark the release as a prerelease'
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine release version
      id: release
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $tag = "${{ inputs.tag_name }}"
        } else {
          $tag = "${{ github.ref_name }}"
        }

        if ($tag -notmatch '^v\d+\.\d+\.\d+-net48$') {
          throw "Release tag must look like v1.2.3-net48; got '$tag'."
        }

        # Strip the leading 'v' and the '-net48' suffix to get a numeric assembly version.
        $version = ($tag.Substring(1) -replace '-net48$', '')
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/FlaUI.Mcp/FlaUI.Mcp.csproj

    - name: Publish (net48, AnyCPU)
      run: |
        dotnet publish src/FlaUI.Mcp/FlaUI.Mcp.csproj `
          --configuration Release `
          --output ./publish/net48 `
          -p:Version=${{ steps.release.outputs.version }}

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path ./publish/net48/* -DestinationPath ./FlaUI-MCP-${{ steps.release.outputs.version }}-net48.zip
      shell: pwsh

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-net48
        path: ./*.zip

  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine release version
      id: release
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          tag="${{ inputs.tag_name }}"
          draft="${{ inputs.draft }}"
          prerelease="${{ inputs.prerelease }}"
        else
          tag="${GITHUB_REF_NAME}"
          draft="false"
          prerelease="false"
        fi

        if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-net48$ ]]; then
          echo "Release tag must look like v1.2.3-net48; got '$tag'." >&2
          exit 1
        fi

        version="${tag#v}"
        version="${version%-net48}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "draft=$draft" >> "$GITHUB_OUTPUT"
        echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: release-*
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: FlaUI-MCP ${{ steps.release.outputs.tag }}
        body: |
          ## FlaUI-MCP ${{ steps.release.outputs.tag }}

          An MCP server for Windows desktop automation using accessibility APIs.

          This is the **.NET Framework 4.8** build. It exists as a separate release
          line for scenarios where FlaUI's native UI Automation calls (for example
          against Telerik/Infragistics controls) misbehave under the .NET Core runtime.

          ### Download

          | Asset | Notes |
          |-------|-------|
          | `FlaUI-MCP-*-net48.zip` | Runs on any Windows 10 (1903+) / Windows 11 machine |

          No runtime download is required: .NET Framework 4.8 ships with Windows.
          The build is AnyCPU, so it runs on both x64 and ARM64 Windows.

          ### Installation

          1. Download and extract `FlaUI-MCP-*-net48.zip`
          2. Add to your MCP config:
          ```json
          {
            "mcpServers": {
              "windows": {
                "type": "local",
                "command": "C:\\path\\to\\FlaUI.Mcp.exe",
                "tools": ["*"]
              }
            }
          }
          ```

          See [README](https://github.com/shanselman/FlaUI-MCP#readme) for full documentation.
        files: artifacts/*.zip
        draft: ${{ steps.release.outputs.draft }}
        prerelease: ${{ steps.release.outputs.prerelease }}
